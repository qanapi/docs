openapi: 3.0.0
info:
  title: Qanapi API v3
  version: 3.0.0
  description: Qanapi API version 3
servers:
  - url: https://your-account.qanapi.cloud/api/v3
    description: Production server
paths:
  "/encryption/{proxy}/encrypt":
    post:
      summary: "Encrypt data"
      x-mint:
        href: "/v3/encryption/{proxy}/encrypt"
        metadata:
          title: "Encrypt data"
          sidebarTitle: "Encrypt data"
      parameters:
        - name: proxy
          in: path
          required: true
          schema:
            type: string
          description: "The proxy slug of the encryption container."
        - name: x-qanapi-fields
          in: header
          required: true
          schema:
            type: string
          description: "Comma separated list of fields to encrypt"
        - name: x-qanapi-destination
          in: header
          required: false
          schema:
            type: string
          description: "A URL to forward the encrypted data to.  All non-qanapi headers will be forwarded to the destination."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: "Encrypted data"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  "/encryption/{proxy}/decrypt":
    post:
      summary: "Decrypt data"
      x-mint:
        href: "/v3/encryption/{proxy}/decrypt"
        metadata:
          title: "Decrypt data"
          sidebarTitle: "Decrypt data"
      parameters:
        - name: proxy
          in: path
          required: true
          schema:
            type: string
          description: "The proxy slug of the encryption container."
        - name: x-qanapi-fields
          in: header
          required: false
          schema:
            type: string
          description: "Comma separated list of fields to decrypt"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: "Decrypted data"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  schemas:
    User:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        two_factor_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    Role:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    Permission:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    Container:
      type: object
      required:
        - id
        - name
        - type
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        values:
          type: array
          items:
            $ref: '#/components/schemas/Value'
    Value:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
        value:
          type: string
    ApiKeyString:
      type: string
      pattern: '^qapi_.*'
      example: "qapi_1234567890abcdef1234567890abcdef"
    ApiKey:
      type: object
      required:
        - id
        - prefix
        - status
      properties:
        id:
          type: string
          example: "1"
        prefix:
          type: string
          example: "qapi_"
        status:
          type: string
          enum:
            - active
            - revoked
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
        user:
          $ref: '#/components/schemas/User'
        configurations:
          type: array
          items:
            $ref: '#/components/schemas/Container'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    ActivityLog:
      type: object
      properties:
        action:
          type: string
        description:
          type: string
        ip:
          type: string
          nullable: true
        when:
          type: string
        timestamp:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
    ApiLog:
      type: object
      properties:
        api_key_id:
          type: integer
        domain:
          type: string
        endpoint:
          type: string
        method:
          type: string
        status_code:
          type: integer
        configuration_id:
          type: integer
          nullable: true
        request_id:
          type: string
          nullable: true
        proxied:
          type: boolean
        proxied_to:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        api_key:
          $ref: '#/components/schemas/ApiKey'
    QanapiFlowLog:
      type: object
      properties:
        configuration_id:
          type: integer
          nullable: true
        type:
          type: string
        action:
          type: string
        email:
          type: string
          format: email
          nullable: true
        request_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Qanapi-Authorization
security:
  - ApiKey: [ ]
