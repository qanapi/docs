# Qanapi Standalone API v3 - OpenAPI description.
#
# This file describes the surface the service actually serves, and is checked
# against a running instance, so a divergence between this file and the service
# is a bug in one of them rather than an expected drift.
openapi: 3.1.0

info:
  title: Qanapi Standalone API
  version: 3.0.0
  summary: Single-tenant encryption, key management, classification and audit service.
  description: |
    A standalone cryptographic service. Callers hand it data and it returns
    ciphertext, or hand it ciphertext and it returns data, with every operation
    authorised by policy and recorded on a tamper-evident audit trail.

    ## Authentication

    Two credentials reach the same principal:

    - **API key** in `X-Qanapi-Authorization`, for machine callers. A key reaches
      only the configurations it is linked to.
    - **User bearer token** in `Authorization`, from `POST /api/v3/auth/login`,
      for a person working through a console.

    An API key outranks a bearer token when a request carries both, because a
    key names a narrower credential than the user that owns it.

    ## Request bodies

    Endpoints that take a JSON body require `Content-Type: application/json`.
    The two encryption endpoints are the exception: in whole-body mode they
    accept any bytes at all, whatever the content type says.

    ## Errors

    Every error body carries `message`, which is human readable, and `error`, a
    stable machine readable code that clients can branch on. Validation failures
    additionally carry an `errors` object keyed by the field each message
    concerns; a failure with no single field to blame is filed under `request`.

    ## Rate limiting

    Every response carries `X-RateLimit-Limit` and `X-RateLimit-Remaining`. The
    window is per node and keyed on the client address, so a cluster of n nodes
    admits n times the configured figure.

    `POST /api/v3/auth/login` is limited separately and more strictly, ten a
    minute against sixty, because it needs no credential to reach and each
    attempt costs a full password verification. A successful login clears that
    budget, so the stricter limit falls on failed attempts rather than on
    legitimate sign-ins.

    ## Correlation

    Send `X-Request-Id` to tie a request to your own trace. The value is
    preserved on the audit record and echoed on the response, provided it is at
    most 64 characters of letters, digits, `-`, `_`, `.` or `:`; anything else
    is replaced with a generated id. Omit the header and one is generated for
    you.

    ## End-to-end encrypted requests and responses

    Any endpoint accepts a request body wrapped as an RFC 7516 JWE, so the
    payload is unreadable by anything between your client and this service,
    including the reverse proxy that terminates TLS. Wrap the JSON body to the
    key from `GET /api/v3/qanapi-public-key` and send it with
    `Content-Type: application/jose`; `application/jwt` and
    `application/jose+json` are accepted too, and a body that is plainly a
    compact JWE is recognised even without one of those content types. Where the
    installation requires it, the wrapped payload must carry `iat`, `exp` and
    `jti` claims, which also make each payload single-use.

    To have the **response** wrapped in turn, send
    `X-Qanapi-Wrap-With-Key-Id` naming an RSA key held in this service's KMS
    that you hold the private half of. The response then arrives as a compact
    JWE with `Content-Type: application/jose`. The header spelling
    `wrap_with_key_id` is accepted as well. The wrapping key is resolved with
    the same permission a plain key read needs, so a caller who may not read
    that key gets an error instead of a wrapped body.
  license:
    name: Proprietary
    identifier: LicenseRef-Qanapi-Commercial

servers:
- url: https://{host}
  description: A deployed instance, behind the reverse proxy that terminates TLS.
  variables:
    host:
      default: qanapi.example.com
- url: http://localhost:8000
  description: A local cluster, through its load balancer.

security:
- ApiKeyAuth: []
- BearerAuth: []

tags:
- name: STAND Health
  description: |
    Liveness and readiness probes. Registered outside the authentication, audit
    and transport layers, so a load balancer polling them without credentials
    still gets an answer.
- name: STAND Authentication
  description: |
    Logging in. There is no registration endpoint: the first administrator is
    created from the command line on the host, so nothing reachable over the
    network can claim an installation that has no users yet. Later accounts are
    created through `POST /api/v3/users`.
- name: STAND Users
  description: User accounts and their roles.
- name: STAND API keys
  description: |
    Machine credentials. A key is scoped to a set of configurations and reaches
    nothing until it is linked to at least one.
- name: STAND Configurations
  description: |
    Encryption configurations. A configuration owns a master key and is the unit
    of cryptographic isolation.
- name: STAND Classifications
  description: Sensitivity labels and the clearance that reaches them.
- name: STAND Policies
  description: Allow and deny rules binding a principal to actions on resources.
- name: STAND Encryption
  description: |
    The data plane. Field-level or whole-body encryption under a configuration,
    optionally forwarded onward to a destination of the caller's choosing.
- name: STAND KMS
  description: Customer-managed key lifecycle, import and export.
- name: STAND Audit
  description: The tamper-evident record of everything the service did.
- name: STAND Transport
  description: The service's own key pair, for end-to-end encrypted request bodies.

paths:

  # ----------------------------------------------------------------- health

  /health/live:
    get:
      tags: [STAND Health]
      summary: Liveness probe
      description: |
        Touches nothing external, so a database outage cannot make an
        orchestrator restart otherwise healthy nodes.
      operationId: healthLive
      security: []
      responses:
        '200':
          description: The process is running.
          content:
            application/json:
              schema:
                type: object
                required: [status, instance_id, version]
                properties:
                  status: { type: string, const: ok }
                  instance_id:
                    type: string
                    description: Which cluster node answered.
                    examples: [node-01]
                  version: { type: string, examples: ['1.0.1'] }

  /health/ready:
    get:
      tags: [STAND Health]
      summary: Readiness probe
      description: |
        Requires a working database pool. FIPS state and audit queue depth are
        reported but do not by themselves fail the probe: a deep queue spills to
        the write-ahead log rather than losing records, and removing the node
        from rotation would only push load onto its peers.

        The detailed body is returned only when the installation sets
        `EXPOSE_HEALTH_DETAIL`, which it does not outside local environments,
        because this endpoint answers before authentication. Otherwise only
        `status` is present.
      operationId: healthReady
      security: []
      responses:
        '200':
          description: Ready for traffic.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: Not ready; the database pool is unreachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }

  # --------------------------------------------------------- authentication

  /api/v3/auth/login:
    post:
      tags: [STAND Authentication]
      summary: Exchange credentials for a bearer token
      description: |
        Rate limited to ten attempts a minute per client address, separately
        from and more strictly than the rest of the surface, because this
        endpoint needs no credential to reach and each attempt costs a full
        password verification.

        A successful login clears that budget, so the limit falls on failed
        attempts rather than on legitimate sign-ins.

        The returned token carries the account's role and password generation.
        Changing either ends every token issued beforehand.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: |
            The email or the password was wrong. Which one is deliberately not
            distinguished, and both cases cost the same amount of time.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ------------------------------------------------------------------ users

  /api/v3/users:
    get:
      tags: [STAND Users]
      summary: List users
      description: |
        Every account, oldest first. Requires `user:manage`. Not paginated and
        not filtered.
      operationId: listUsers
      responses:
        '200':
          description: Every user.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [STAND Users]
      summary: Create a user
      description: |
        Requires `user:manage`. The email address is lowercased and trimmed
        before it is stored, and must be unique. `role` defaults to `user`, so
        naming `admin` here is a deliberate promotion.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '200':
          description: The new user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: That email address is already registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v3/users/me:
    get:
      tags: [STAND Users]
      summary: The authenticated user
      description: |
        For an API key this is the user that owns the key, which is the identity
        its classification clearance resolves through.
      operationId: currentUser
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '404':
          description: The credential resolves to no user account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v3/users/{id}:
    parameters:
    - $ref: '#/components/parameters/UserId'
    get:
      tags: [STAND Users]
      summary: Fetch a user
      description: |
        A caller may always read their own account. Reading anybody else's
        requires `user:manage`.
      operationId: getUser
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [STAND Users]
      summary: Update a user
      description: |
        Only the fields present in the body are changed.

        Changing your own password or email requires `current_password`, because
        that operation converts possession of a credential into lasting control
        of the account. A non-user credential may not do it at all: an API key
        carries its owner's identity, so without this rule a scoped machine
        credential could set the owner's password and become an interactive
        login. A caller holding `user:manage` may still reset somebody else's
        credentials, which is what that permission is for.

        Changing `role` requires `user:manage` and is refused on your own
        account. Changing the password ends every session that preceded it,
        across the whole cluster and at once.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401':
          description: |
            The credential did not verify, or `current_password` did not match
            the account it was presented for.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: That email address is already registered to another account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            The body is invalid, `current_password` was required and not given,
            a non-user credential attempted a credential change, or the caller
            tried to change their own role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
    put:
      tags: [STAND Users]
      summary: Update a user
      description: |
        Identical to `PATCH` on this path, including that absent fields are left
        alone rather than cleared.
      operationId: replaceUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401':
          description: |
            The credential did not verify, or `current_password` did not match
            the account it was presented for.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: That email address is already registered to another account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [STAND Users]
      summary: Delete a user
      description: |
        Requires `user:manage`. A caller may not delete their own account, and
        the last remaining administrator may not be deleted at all, because an
        installation with none cannot be managed through this API.
      operationId: deleteUser
      responses:
        '204': { description: Deleted. No body. }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            The caller named their own account, or the last administrator.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }

  # -------------------------------------------------------------- api keys

  /api/v3/api-keys:
    get:
      tags: [STAND API keys]
      summary: List API keys
      description: |
        A caller without `apikey:manage` sees only their own keys. Each key is
        returned with the configurations it may reach. Not paginated.
      operationId: listApiKeys
      responses:
        '200':
          description: Keys, each with the configurations it may reach.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiKey' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
    post:
      tags: [STAND API keys]
      summary: Mint an API key
      description: |
        The plaintext key is in the response and is never recoverable
        afterwards: only its hash is stored.

        Minting a key for another user requires `apikey:manage`, and so does
        naming `configuration_ids`, because that decides what the new credential
        can reach. A key created without them reaches nothing until it is
        linked.
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApiKeyRequest' }
      responses:
        '201':
          description: Created. This is the only time `key` is returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyWithSecret' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: |
            The body is invalid, `name` is empty, the named owner does not
            exist, or the credential names no user to own the key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }

  /api/v3/api-keys/{id}:
    parameters:
    - $ref: '#/components/parameters/ApiKeyId'
    get:
      tags: [STAND API keys]
      summary: Fetch an API key
      description: |
        A caller may read their own keys; reading anybody else's requires
        `apikey:manage`. A caller holding neither is told the key does not
        exist rather than that it exists and belongs to somebody else.
      operationId: getApiKey
      responses:
        '200':
          description: The key, with its configurations and without its secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKey' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '404': { $ref: '#/components/responses/NotFoundOrNotYours' }
    delete:
      tags: [STAND API keys]
      summary: Delete an API key
      description: |
        Prefer revoking. Deleting removes the record an audit entry's principal
        points at, which makes the trail harder to read later.
      operationId: deleteApiKey
      responses:
        '204': { description: Deleted. No body. }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '404': { $ref: '#/components/responses/NotFoundOrNotYours' }

  /api/v3/api-keys/{id}/rotate:
    parameters:
    - $ref: '#/components/parameters/ApiKeyId'
    post:
      tags: [STAND API keys]
      summary: Rotate an API key
      description: |
        Issues a new secret for the same key record, so policies and
        configuration links attached to it survive. The previous secret stops
        working immediately across the whole cluster. A revoked key cannot be
        rotated.

        The response carries the new plaintext once. It does not include
        `configurations`; read the key back if you need them.
      operationId: rotateApiKey
      responses:
        '200':
          description: Rotated. The new plaintext is returned once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyWithSecret' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403':
          description: The key has been revoked, so there is nothing to rotate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFoundOrNotYours' }

  /api/v3/api-keys/{id}/revoke:
    parameters:
    - $ref: '#/components/parameters/ApiKeyId'
    post:
      tags: [STAND API keys]
      summary: Revoke an API key
      description: |
        Takes effect across every node at once rather than after a cache
        expires. Revocation is permanent: a revoked key cannot be restored, and
        cannot be revoked twice.
      operationId: revokeApiKey
      responses:
        '204': { description: Revoked. No body. }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403':
          description: The key was already revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFoundOrNotYours' }

  /api/v3/api-keys/{id}/configurations:
    parameters:
    - $ref: '#/components/parameters/ApiKeyId'
    put:
      tags: [STAND API keys]
      summary: Set the configurations a key may reach
      description: |
        Replaces the whole set. Sending an empty list detaches the key from
        everything, which stops it reaching data without revoking it.

        Requires `apikey:manage` even on your own key, because widening what a
        credential reaches is a management action. Every id is verified before
        anything is written, so a request naming one bad id does not
        half-apply. The change takes effect immediately across the cluster.
      operationId: setApiKeyConfigurations
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetApiKeyConfigurationsRequest' }
      responses:
        '200':
          description: The key, with its new configuration set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKey' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Concurrent writes to the same key could not be serialised. The write
            is sound; retry it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            The body is invalid, or one of the `configuration_ids` names no
            configuration. The offending id is reported under
            `errors.configuration_ids`, and nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
    patch:
      tags: [STAND API keys]
      summary: Set the configurations a key may reach
      description: Identical to `PUT` on this path; it replaces the whole set.
      operationId: patchApiKeyConfigurations
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetApiKeyConfigurationsRequest' }
      responses:
        '200':
          description: The key, with its new configuration set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKey' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Concurrent writes to the same key could not be serialised. The write
            is sound; retry it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # -------------------------------------------------------- configurations

  /api/v3/configurations:
    get:
      tags: [STAND Configurations]
      summary: List configurations
      description: |
        Every configuration, by name. Requires `configuration:read`. Key
        material never appears. Not paginated.
      operationId: listConfigurations
      responses:
        '200':
          description: Every configuration.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Configuration' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [STAND Configurations]
      summary: Create a configuration
      description: |
        Requires `configuration:manage`. Provisions a master key through the
        configured provider, and fixes the algorithm at `aes-256-gcm`.

        The `proxy_slug` is generated as sixteen random characters unless one is
        supplied: deriving it from the name would make the URL of every
        encryption call guessable from the configuration's name. A supplied slug
        is normalised to lowercase, with anything other than a letter or digit
        becoming a hyphen.
      operationId: createConfiguration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConfigurationRequest' }
      responses:
        '200':
          description: The new configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Configuration' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Another configuration already uses this name or proxy slug.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            `name` is empty, or the supplied `proxy_slug` contains no usable
            characters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }

  /api/v3/configurations/{id}:
    parameters:
    - $ref: '#/components/parameters/ConfigurationId'
    get:
      tags: [STAND Configurations]
      summary: Fetch a configuration
      description: Requires `configuration:read` on this configuration.
      operationId: getConfiguration
      responses:
        '200':
          description: The configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Configuration' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [STAND Configurations]
      summary: Update a configuration
      description: |
        Requires `configuration:manage`. Only `name` and `proxy_slug` can be
        changed, and only the fields present in the body are touched.

        Changing `proxy_slug` changes the URL every caller encrypts through.
        Existing ciphertext stays readable, because an envelope names a key
        record rather than a slug. A slug that any policy statement already
        names is refused, because renaming a configuration onto it would hand
        that statement's holders another configuration's plaintext.
      operationId: updateConfiguration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateConfigurationRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Configuration' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Another configuration already uses this name or proxy slug, or a
            policy statement already names the requested slug.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: The resulting name or proxy slug would be empty.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
    put:
      tags: [STAND Configurations]
      summary: Update a configuration
      description: |
        Identical to `PATCH` on this path, including that absent fields are left
        alone rather than cleared.
      operationId: replaceConfiguration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateConfigurationRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Configuration' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Another configuration already uses this name or proxy slug, or a
            policy statement already names the requested slug.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [STAND Configurations]
      summary: Delete a configuration
      description: |
        Requires `configuration:manage`. Cascades to every encryption key record
        the configuration owns, so every payload encrypted through it becomes
        permanently unreadable. There is no recovery path.
      operationId: deleteConfiguration
      responses:
        '204': { description: Deleted. No body. }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------- classifications

  /api/v3/classifications:
    get:
      tags: [STAND Classifications]
      summary: List classifications
      description: |
        Paginated. Each returned classification carries the `users` and `roles`
        that hold its clearance.

        The page is taken after the visibility filter rather than in the query,
        because visibility is a per-classification decision: paging in the query
        would return short pages whenever a caller could not see some rows, and
        `total` would describe rows the caller is not allowed to know about.
      operationId: listClassifications
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of classifications.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    data:
                      type: array
                      items: { $ref: '#/components/schemas/Classification' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [STAND Classifications]
      summary: Create a classification
      description: |
        Requires `classification:manage`. The slug is derived from the name when
        one is not supplied, and must be unique either way.
      operationId: createClassification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateClassificationRequest' }
      responses:
        '200':
          description: The new classification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Classification' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A classification with this slug already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v3/classifications/{id}:
    parameters:
    - $ref: '#/components/parameters/ClassificationId'
    get:
      tags: [STAND Classifications]
      summary: Fetch a classification
      description: |
        Requires `classification:read` on this classification. Includes `users`
        and `roles`, which are the principals holding this clearance. A request
        authenticated by an API key is cleared through the user that owns the
        key, so `users` is what decides whether a machine credential can read a
        record carrying this label.
      operationId: getClassification
      responses:
        '200':
          description: The classification, with its cleared principals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Classification' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [STAND Classifications]
      summary: Update a classification
      description: |
        Requires `classification:manage`. Only the fields present in the body
        are changed. The response does not carry `users` or `roles`.
      operationId: updateClassification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateClassificationRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Classification' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Another classification already uses this slug.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    put:
      tags: [STAND Classifications]
      summary: Update a classification
      description: Identical to `PATCH` on this path.
      operationId: replaceClassification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateClassificationRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Classification' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Another classification already uses this slug.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [STAND Classifications]
      summary: Delete a classification
      description: Requires `classification:manage`.
      operationId: deleteClassification
      responses:
        '204': { description: Deleted. No body. }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v3/classifications/{id}/grants:
    parameters:
    - $ref: '#/components/parameters/ClassificationId'
    get:
      tags: [STAND Classifications]
      summary: List clearance grants
      description: |
        Requires `classification:manage`. Returns the principals holding this
        clearance, as bare `principal_type` and `principal_id` pairs.
      operationId: listClassificationGrants
      responses:
        '200':
          description: The principals holding this clearance.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Grant' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [STAND Classifications]
      summary: Grant clearance
      description: |
        Requires `classification:manage`. Granting the same clearance twice is
        harmless. The change takes effect across the cluster at once.
      operationId: grantClassification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Grant' }
      responses:
        '204': { description: Granted. No body. }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            The body is invalid, or `principal_type` is not one of `user`,
            `api_key` or `role`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
    delete:
      tags: [STAND Classifications]
      summary: Revoke clearance
      description: |
        Requires `classification:manage`, and takes the same body as the grant
        it reverses. Revoking a clearance that was never granted is harmless.
      operationId: revokeClassificationGrant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Grant' }
      responses:
        '204': { description: Revoked. No body. }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            The body is invalid, or `principal_type` is not one of `user`,
            `api_key` or `role`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }

  # --------------------------------------------------------------- policies

  /api/v3/policies:
    get:
      tags: [STAND Policies]
      summary: List policies
      description: |
        Requires `policy:manage`. Both filters are optional and combine; with
        neither, every statement is returned. Not paginated.
      operationId: listPolicies
      parameters:
      - name: principal_type
        in: query
        description: Return only statements binding this kind of principal.
        schema: { $ref: '#/components/schemas/PrincipalType' }
      - name: principal_id
        in: query
        description: |
          Return only statements binding this principal: a user id, an API key
          id, or a role name, according to `principal_type`.
        schema: { type: string }
      responses:
        '200':
          description: Matching policies.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Policy' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [STAND Policies]
      summary: Create a policy
      description: |
        Requires `policy:manage`. Actions and resources are validated on write,
        so a typo cannot silently create a statement that grants nothing;
        duplicates within either list are collapsed.

        Two further rules apply to what may be written. A caller writing an
        allow may not grant an action or resource they do not themselves hold,
        and only an administrator may write the `*` wildcard. A caller writing a
        deny may not write one that would leave nobody able to manage policy.

        Statements take effect across the cluster at once.
      operationId: createPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePolicyRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: |
            `name` is empty, `effect` is neither `allow` nor `deny`,
            `principal_type` is unrecognised, `actions` or `resources` is empty
            or names something unrecognised, the caller does not hold what the
            statement would grant, or the deny would leave policy unmanageable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }

  /api/v3/policies/{id}:
    parameters:
    - $ref: '#/components/parameters/PolicyId'
    get:
      tags: [STAND Policies]
      summary: Fetch a policy
      description: Requires `policy:manage`.
      operationId: getPolicy
      responses:
        '200':
          description: The policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [STAND Policies]
      summary: Delete a policy
      description: |
        Requires `policy:manage`. Takes effect across every node at once.
        Deleting a statement can only narrow what the principals it named can
        reach, since the default with no statement is to refuse.
      operationId: deletePolicy
      responses:
        '204': { description: Deleted. No body. }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------- encryption

  /api/v3/encryption/{proxy}/encrypt:
    parameters:
    - $ref: '#/components/parameters/ProxySlug'
    post:
      tags: [STAND Encryption]
      summary: Encrypt a payload
      description: |
        Requires the `encrypt` action on this configuration, and a current
        license: protecting new data is the one operation a lapsed license
        refuses.

        Two modes, chosen by header:

        - **Field mode**, the default. `X-Qanapi-Fields` names dot-separated
          paths inside a JSON body. Each named leaf is replaced by an envelope
          string; everything else is returned untouched. A path that matches
          nothing is skipped, unless `X-Qanapi-Require-Fields` is set.
        - **Whole-body mode**, selected by `X-Qanapi-Full-Body` or
          `X-Qanapi-Mode`. The whole body is treated as one payload and a single
          envelope is returned as `text/plain`, whatever the body was.

        Every payload is AES-256-GCM under a fresh key encryption key and data
        encryption key, so a nonce is never reused under a key.

        Setting `X-Qanapi-Destination` turns the call into a proxy: the
        processed payload is sent on to that URL and the answer is relayed back.
      operationId: encrypt
      parameters:
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/FullBody'
      - $ref: '#/components/parameters/Mode'
      - $ref: '#/components/parameters/ClassificationHeader'
      - $ref: '#/components/parameters/RequireFields'
      - $ref: '#/components/parameters/Destination'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                Any JSON document in field mode. In whole-body mode the body may
                be any bytes at all, including non-JSON.
              additionalProperties: true
            example: {
              "name": "Jane Doe",
              "ssn": "123-45-6789",
              "dob": "1980-01-01"
            }
          text/plain:
            schema: { type: string }
            example: "123-45-6789"
          application/octet-stream:
            schema: { type: string, format: binary }
            example: "123-45-6789"
      responses:
        '200':
          description: |
            In field mode, the document with the named fields replaced by
            envelopes. In whole-body mode, one envelope as `text/plain`.

            When `X-Qanapi-Destination` was set this is instead whatever the
            destination answered, relayed with its own status, body and headers,
            and stamped with `X-Qanapi-Forwarded-To`.
          headers:
            X-Qanapi-Action-Count: { $ref: '#/components/headers/ActionCount' }
            X-Qanapi-Forwarded-To: { $ref: '#/components/headers/ForwardedTo' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example: {
                "name": "Jane Doe",
                "ssn": "QANAPI-RS:v1:MDFhMDg2ZGQ:Vpp6gZK4ZRUwgvpcnA:$",
                "dob": "QANAPI-RS:v1:MDFhMDg2ZGU:T3RoZXJjaXBoZXJ0ZXh0:$"
              }
            text/plain:
              schema:
                type: string
              example: "QANAPI-RS:v1:MDFhMDg2ZGQ:Vpp6gZK4ZRUwgvpcnA:$"
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403':
          description: |
            The policy engine refused the action, the caller does not hold the
            clearance named in `X-Qanapi-Classification`, or the license has
            lapsed. Applying a classification the caller lacks is refused rather
            than allowed, because it would let them write data they immediately
            cannot read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: |
            No configuration has that proxy slug, the presented key is not
            linked to the one that does, or `X-Qanapi-Classification` names a
            classification that does not exist. The first two are deliberately
            not distinguished, so an unrelated key cannot enumerate
            configurations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: |
            The body is not the JSON that field mode requires, a field path
            matched nothing while `X-Qanapi-Require-Fields` was set and nothing
            was changed, or `X-Qanapi-Destination` is not an absolute `http` or
            `https` URL that this installation permits.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500':
          description: |
            A forwarding destination was named and could not be reached. The
            cryptography succeeded; the forward did not.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v3/encryption/{proxy}/decrypt:
    post:
      tags: [STAND Encryption]
      summary: Decrypt a payload
      description: |
        Requires the `decrypt` action on this configuration. The inverse of
        encrypt, with the same two modes and the same forwarding behaviour.
        Reading data already protected is always served, whatever the license
        says.

        An envelope is refused unless it was produced in the configuration it is
        presented to, independently of the authentication tag, and unless the
        caller holds the clearance the record carries. Envelopes in the earlier
        `qanapi:` format are refused as a format error rather than attempted and
        failed.

        `X-Qanapi-Classification` has no effect here: a record's classification
        is read from the record.
      operationId: decrypt
      parameters:
      - $ref: '#/components/parameters/ProxySlug'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/FullBody'
      - $ref: '#/components/parameters/Mode'
      - $ref: '#/components/parameters/RequireFields'
      - $ref: '#/components/parameters/Destination'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "A JSON object to decrypt fields on.  A maximum depth of 32 is allowed."
              additionalProperties: true
            example: {
              "name": "Jane Doe",
              "ssn": "QANAPI-RS:v1:MDFhMDg2ZGQ:Vpp6gZK4ZRUwgvpcnA:$"
            }
          text/plain:
            schema: { type: string }
            example: "QANAPI-RS:v1:MDFhMDg2ZGQ:Vpp6gZK4ZRUwgvpcnA:$"
      responses:
        '200':
          description: |
            The plaintext, in the shape it was encrypted from. In field mode the
            document is returned as JSON. In whole-body mode the original bytes
            are returned under a content type inferred from them:
            `application/json`, `application/xml`, `text/plain` or
            `application/octet-stream`.
          headers:
            X-Qanapi-Action-Count: { $ref: '#/components/headers/ActionCount' }
            X-Qanapi-Forwarded-To: { $ref: '#/components/headers/ForwardedTo' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example: {
                "name": "Jane Doe",
                "ssn": "123-45-6789"
              }
            text/plain:
              schema: { type: string }
              example: "123-45-6789"
            application/xml:
              schema: { type: string }
              example: "123-45-6789"
            application/octet-stream:
              schema: { type: string, format: binary }
              example: "123-45-6789"
        '400':
          description: |
            No credential, or the envelope could not be read. Every
            cryptographic failure answers identically, so neither the status nor
            the body says whether a format check, an authentication tag or a key
            lookup was what failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403':
          description: |
            The policy engine refused the action, or the caller does not hold
            the clearance the record carries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/ProxyNotReachable' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: |
            The body is not the JSON that field mode requires, a field path
            matched nothing while `X-Qanapi-Require-Fields` was set, or
            `X-Qanapi-Destination` is not an absolute `http` or `https` URL that
            this installation permits.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500':
          description: |
            A forwarding destination was named and could not be reached. The
            cryptography succeeded; the forward did not.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # -------------------------------------------------------------------- kms

  /api/v3/kms:
    get:
      tags: [STAND KMS]
      summary: List KMS keys
      description: |
        A compact view of each key, without its material. Keys the caller may
        not read are filtered out **after** the page is taken, so a page may
        hold fewer than `per_page` entries without meaning the results have
        ended. There is no envelope and no total; walk the pages until one comes
        back empty.
      operationId: listKmsKeys
      parameters:
      - name: proxy_slug
        in: query
        description: |
          Restrict to keys owned by the configuration with this proxy slug. The
          caller must be able to reach that configuration.
        schema: { type: string, examples: [952zpx6vyig3sdyp] }
      - name: state
        in: query
        description: Restrict to keys in this lifecycle state.
        schema: { $ref: '#/components/schemas/KeyState' }
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPageTwentyFive'
      responses:
        '200':
          description: Matching keys, without their material.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/KmsKeyBrief' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ConfigurationNotFound' }

  /api/v3/kms/create/{proxy}:
    parameters:
    - $ref: '#/components/parameters/ProxySlug'
    post:
      tags: [STAND KMS]
      summary: Generate a KMS key
      description: |
        Requires `kms:create` on the configuration, and a current license.

        `type` is `AES` or `RSA`. Name `algorithm` for an exact choice, or leave
        it out and let `key_length` or `rsa_modulus` decide; the defaults are
        AES-256-GCM and RSA-2048. The reported `algorithm` is the key length
        without the cipher mode, so an AES key reads as `AES-256` with the mode
        alongside it in `cipher_mode`.

        `usage_mask` defaults to `["encrypt", "decrypt"]`.

        A key is not exportable unless `private_material_retrievable` is set at
        creation. That decision cannot be made later for a key that was
        generated without it.
      operationId: createKmsKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateKmsKeyRequest' }
      responses:
        '200':
          description: |
            The new key. `private_key_material` is present only when
            `export_on_create` was set and a wrap key was named.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KmsKey' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403':
          description: |
            The policy engine refused the action, or the license has lapsed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/ConfigurationNotFound' }
        '422':
          description: |
            `type`, `algorithm`, a key length or a usage is unsupported, or
            `export_on_create` was set without `wrap_with_key_id`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }

  /api/v3/kms/import/{proxy}:
    parameters:
    - $ref: '#/components/parameters/ProxySlug'
    post:
      tags: [STAND KMS]
      summary: Import a key
      description: |
        Requires `kms:import` on the configuration, and a current license.

        Supply exactly one of two things: a private key wrapped as a JWE to this
        service's transport public key, or a bare `public_key_pem`. Importing
        only a public half keeps the unwrapping key off this server entirely,
        which is the point of doing it that way. `type` is required alongside
        `jwe`.
      operationId: importKmsKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportKmsKeyRequest' }
      responses:
        '200':
          description: The imported key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KmsKey' }
        '400':
          description: |
            No credential, or the supplied `jwe` could not be read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403':
          description: |
            The policy engine refused the action, or the license has lapsed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/ConfigurationNotFound' }
        '422':
          description: |
            Neither `jwe` nor `public_key_pem` was given, `type` is missing
            alongside a private key, or the material does not match the
            algorithm it is declared under.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }

  /api/v3/kms/{uuid}:
    parameters:
    - $ref: '#/components/parameters/KeyUuid'
    get:
      tags: [STAND KMS]
      summary: Fetch a KMS key
      description: |
        Requires `kms:read` on the key. Private material is never included here,
        whatever the key's export settings say.
      operationId: getKmsKey
      responses:
        '200':
          description: The key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KmsKey' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [STAND KMS]
      summary: Update a KMS key
      description: |
        Requires `kms:update` on the key. Metadata only: the key material, its
        algorithm and its configuration cannot be changed.

        `private_material_retrievable` can be withdrawn but not granted. A key
        generated as non-exportable stays that way, because the guarantee made
        when it was created has to keep holding.
      operationId: updateKmsKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateKmsKeyRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KmsKey' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            A usage is unrecognised, or `private_material_retrievable` was set
            to true on a key generated without it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }

  /api/v3/kms/{uuid}/export:
    parameters:
    - $ref: '#/components/parameters/KeyUuid'
    post:
      tags: [STAND KMS]
      summary: Export a key's private material
      description: |
        Requires `kms:export` on the key, and a key marked
        `private_material_retrievable` whose export window has not closed.

        Returns the private half wrapped as an RFC 7516 JWE under the named RSA
        wrap key, so it is readable only by whoever holds that key's private
        half. Each export increments `export_count`, which is on the audit
        trail.
      operationId: exportKmsKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportKmsKeyRequest' }
      responses:
        '200':
          description: The key, with `private_key_material.jwe` present.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KmsKey' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403':
          description: |
            The key is not marked exportable, its export window has closed, or
            the caller lacks `kms:export`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such key, or `wrap_with_key_id` names no usable RSA key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v3/kms/{uuid}/rotate:
    parameters:
    - $ref: '#/components/parameters/KeyUuid'
    post:
      tags: [STAND KMS]
      summary: Rotate a KMS key
      description: |
        Requires `kms:rotate` on the key, and a current license.

        Generates a replacement with the same algorithm and settings, linked to
        the original through `rotated_from`. The original is left readable so
        material encrypted under it still decrypts.

        The body is optional; send none to rotate without exporting.
      operationId: rotateKmsKey
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotateKmsKeyRequest' }
      responses:
        '200':
          description: The replacement key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KmsKey' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403':
          description: |
            The policy engine refused the action, or the license has lapsed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            `export_on_create` was set without `wrap_with_key_id`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }

  /api/v3/kms/{uuid}/revoke:
    parameters:
    - $ref: '#/components/parameters/KeyUuid'
    patch:
      tags: [STAND KMS]
      summary: Revoke a KMS key
      description: |
        Requires `kms:revoke` on the key. Takes effect across every node at
        once. A revoked key cannot encrypt, decrypt or export until it is
        restored.

        The body is optional; send none to revoke without recording a reason.
      operationId: revokeKmsKey
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokeKmsKeyRequest' }
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KmsKey' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The key was already revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v3/kms/{uuid}/restore:
    parameters:
    - $ref: '#/components/parameters/KeyUuid'
    patch:
      tags: [STAND KMS]
      summary: Restore a revoked key
      description: |
        Requires `kms:restore` on the key. Returns it to `active` and clears the
        revocation reason. Takes no request body.
      operationId: restoreKmsKey
      responses:
        '200':
          description: Restored to active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KmsKey' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The key is not revoked, so there is nothing to restore.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ------------------------------------------------------------------ audit

  /api/v3/audit-logs:
    get:
      tags: [STAND Audit]
      summary: Query the audit trail
      description: |
        Requires `audit:read`. Every filter is optional and all of them combine.
        Records come back newest first, in a paginated envelope whose `total`
        counts every matching record rather than the ones on this page.
      operationId: listAuditLogs
      parameters:
      - $ref: '#/components/parameters/AuditFrom'
      - $ref: '#/components/parameters/AuditTo'
      - $ref: '#/components/parameters/AuditAction'
      - $ref: '#/components/parameters/AuditConfigurationId'
      - $ref: '#/components/parameters/AuditPrincipalId'
      - $ref: '#/components/parameters/AuditPrincipalType'
      - $ref: '#/components/parameters/AuditStatus'
      - $ref: '#/components/parameters/AuditRequestId'
      - $ref: '#/components/parameters/AuditInstanceId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPageTwentyFive'
      responses:
        '200':
          description: A page of records.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    data:
                      type: array
                      items: { $ref: '#/components/schemas/AuditRecord' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v3/audit-logs/export:
    post:
      tags: [STAND Audit]
      summary: Export, and optionally purge, audit records
      description: |
        Requires `audit:export`, and `audit:purge` as well when purging.

        Streams matching records as JSON Lines or CSV, oldest first, optionally
        gzipped. One export covers at most 100,000 records; narrow the filters
        and repeat if you have more. The filters are the ones the query endpoint
        accepts, sent in the body; `page` and `per_page` are accepted and
        ignored.

        With `purge` set, the exported records are deleted in the same
        transaction that read them, so nothing can be purged that was not
        successfully exported. A purge is itself recorded, with the window it
        covered, so a later chain verification can tell an authorised purge
        apart from tampering.

        The body is optional; send none to export everything in the default
        format.
      operationId: exportAuditLogs
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportRequest' }
      responses:
        '200':
          description: |
            The export stream. `Content-Type` follows `format`, and a gzipped
            export is the same content type under `Content-Encoding: gzip`
            rather than a type of its own.
          headers:
            Content-Disposition:
              description: |
                Names a generated file, `audit-<timestamp>.<format>`, with `.gz`
                appended when the export is gzipped.
              schema: { type: string, examples: ['attachment; filename="audit-20260917T101500Z.jsonl"'] }
            Content-Encoding:
              description: Present, and `gzip`, only when `gzip` was requested.
              schema: { type: string, const: gzip }
            X-Qanapi-Audit-Records:
              description: How many records the export contains.
              schema: { type: integer }
            X-Qanapi-Audit-Chain-Verified:
              description: |
                Whether the hash chain over the exported records verified. A
                `false` here is a compliance event in its own right, and the
                export is still returned so it can be examined.
              schema: { type: string, enum: ['true', 'false'] }
          content:
            application/x-ndjson:
              schema: { type: string }
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            The matching records changed while a purging export was running, so
            nothing was purged and nothing was returned. Retry it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v3/audit-logs/verify:
    get:
      tags: [STAND Audit]
      summary: Verify the hash chain
      description: |
        Requires `audit:read`. Recomputes the chain over a range without
        exporting it, covering at most 100,000 records. Each record is an HMAC
        over the whole record and its predecessor's hash, so editing any field
        of any record breaks every link after it.

        `gaps` are distinguished from `broken_links` deliberately. A filtered
        query legitimately produces gaps, and so does an authorised purge; a
        broken link is the finding that matters. Purge windows are consulted, so
        a gap explained by a recorded purge is listed under
        `explained_by_purge` rather than reported as tampering.

        Chains are maintained per node, so verifying one `instance_id` at a time
        is the normal way to use this.

        This endpoint accepts every filter the query endpoint accepts. The ones
        below are the ones worth using; `page` and `per_page` are accepted and
        ignored.
      operationId: verifyAuditChain
      parameters:
      - $ref: '#/components/parameters/AuditFrom'
      - $ref: '#/components/parameters/AuditTo'
      - $ref: '#/components/parameters/AuditInstanceId'
      - $ref: '#/components/parameters/AuditAction'
      - $ref: '#/components/parameters/AuditPrincipalId'
      - $ref: '#/components/parameters/AuditConfigurationId'
      responses:
        '200':
          description: The chain verified over the range examined.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChainVerification' }
        '400': { $ref: '#/components/responses/NoCredential' }
        '401': { $ref: '#/components/responses/BadCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            The chain did not verify. The body is the same summary, naming what
            failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChainVerification' }

  # -------------------------------------------------------------- transport

  /api/v3/qanapi-public-key:
    get:
      tags: [STAND Transport]
      summary: The service's public key
      description: |
        Unauthenticated, because a client needs this before it can encrypt a
        request body. Use it to wrap a request as an RFC 7516 JWE when the
        payload should not be readable by anything between the client and this
        service, including the reverse proxy that terminates TLS.

        Distribution only: there is no API call that rotates this pair. A pair
        that a rotation replaces stays valid until it expires, so requests
        already in flight still decrypt. Re-read this endpoint after
        `rotates_after` to pick the successor up.
      operationId: getQanapiPublicKey
      security: []
      responses:
        '200':
          description: The current public key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QanapiKey' }
        '404':
          description: No key pair has been provisioned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Qanapi-Authorization
      description: |
        A machine credential, `qk_` followed by its secret. Only a hash of the
        secret is stored, so a key is displayed exactly once, when it is created
        or rotated. A key reaches only the configurations it is linked to.

        It may also be sent as `Authorization: Bearer qk_...`, which is
        recognised by the prefix.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A user token from `POST /api/v3/auth/login`. The token asserts a role,
        but the database decides it, so a role changed or a user deleted after
        the token was issued takes effect immediately. A token minted before a
        password change is refused.

  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: The user's id.
      schema: { type: string, format: uuid }
    ApiKeyId:
      name: id
      in: path
      required: true
      description: The API key's id. Not the key itself, and not its prefix.
      schema: { type: string, format: uuid }
    PolicyId:
      name: id
      in: path
      required: true
      description: The policy statement's id.
      schema: { type: string, format: uuid }
    ConfigurationId:
      name: id
      in: path
      required: true
      description: The configuration's id, or its proxy slug. Either resolves.
      schema: { type: string, examples: ['952zpx6vyig3sdyp'] }
    ClassificationId:
      name: id
      in: path
      required: true
      description: The classification's id, or its slug. Either resolves.
      schema: { type: string, examples: [top-secret] }
    KeyUuid:
      name: uuid
      in: path
      required: true
      description: The key's `key_id`.
      schema: { type: string, format: uuid }
    ProxySlug:
      name: proxy
      in: path
      required: true
      description: |
        The configuration's proxy slug. Sixteen random lowercase letters and
        digits unless one was pinned at creation.
      schema: { type: string, examples: [952zpx6vyig3sdyp] }

    Page:
      name: page
      in: query
      description: |
        1-based page number. A missing, zero or unparseable value is the first
        page.
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      description: |
        Rows per page. A larger figure is reduced to the maximum rather than
        refused.
      schema: { type: integer, minimum: 1, maximum: 200, default: 15 }
    PerPageTwentyFive:
      name: per_page
      in: query
      description: |
        Rows per page. A larger figure is reduced to the maximum rather than
        refused. Note the default differs from the one on
        `GET /api/v3/classifications`.
      schema: { type: integer, minimum: 1, maximum: 200, default: 25 }

    AuditFrom:
      name: from
      in: query
      description: Only records at or after this instant.
      schema: { type: string, format: date-time }
    AuditTo:
      name: to
      in: query
      description: Only records at or before this instant.
      schema: { type: string, format: date-time }
    AuditAction:
      name: action
      in: query
      description: |
        An exact action, or a `kms.*` style prefix that matches a whole
        namespace.
      schema: { type: string, examples: ['encryption.encrypt', 'kms.*'] }
    AuditConfigurationId:
      name: configuration_id
      in: query
      description: Only records attributed to this configuration.
      schema: { type: string, format: uuid }
    AuditPrincipalId:
      name: principal_id
      in: query
      description: |
        Only records attributed to this principal: a user id or an API key id.
      schema: { type: string }
    AuditPrincipalType:
      name: principal_type
      in: query
      description: Only records attributed to this kind of principal.
      schema: { type: string, enum: [user, api_key, anonymous, system] }
    AuditStatus:
      name: status
      in: query
      description: |
        Only records with this outcome. `denied` is an authorisation decision
        and `error` is a fault.
      schema: { type: string, enum: [success, denied, error] }
    AuditRequestId:
      name: request_id
      in: query
      description: |
        Only records carrying this correlation id, which is the `X-Request-Id`
        of the request that produced them.
      schema: { type: string }
    AuditInstanceId:
      name: instance_id
      in: query
      description: |
        Only records written by this cluster node. Hash chains are maintained
        per node, so this is the natural unit for chain verification.
      schema: { type: string, examples: [node-01] }

    Fields:
      name: X-Qanapi-Fields
      in: header
      description: |
        Comma-separated dot paths to encrypt or decrypt, for example
        `ssn,user.address.postcode`. Absent in whole-body mode. A path that
        matches nothing is skipped unless `X-Qanapi-Require-Fields` is set.

        A numeric segment indexes one element of an array, so `items.0.card`
        reaches exactly that element. A segment that is not a number, applied to
        an array, is mapped over every element instead: `items.card` reaches the
        `card` of each object in `items`, and each one counts separately towards
        `X-Qanapi-Action-Count`.

        Naming an array itself encrypts it whole, as one value, rather than
        element by element.
      schema: { type: string, examples: ['ssn,user.dob,items.card'] }
    FullBody:
      name: X-Qanapi-Full-Body
      in: header
      description: |
        Treat the whole body as one payload. Any of `true`, `1`, `yes` or `on`
        turns it on; anything else, or the header's absence, leaves field mode
        in effect.
      schema: { type: string, examples: ['true'] }
    Mode:
      name: X-Qanapi-Mode
      in: header
      description: |
        Alternative spelling of whole-body mode. Either spelling of the value
        selects it; any other value leaves field mode in effect.
      schema: { type: string, enum: [full_body, full-body] }
    ClassificationHeader:
      name: X-Qanapi-Classification
      in: header
      description: |
        Apply a classification to what is being encrypted, by slug or id.
        Refused unless the caller holds that clearance. Decryption reads the
        classification from the record, so this header has no effect there.
      schema: { type: string, examples: [top-secret] }
    RequireFields:
      name: X-Qanapi-Require-Fields
      in: header
      description: |
        Fail the request when a named field path matched nothing, rather than
        returning the document unchanged. Off by default, and turned on by any
        of `true`, `1`, `yes` or `on`.

        Worth setting in any caller that would rather hear about a typo than
        store plaintext: without it, a mistyped path returns the original body
        with a success status, and only `X-Qanapi-Action-Count: 0` tells the two
        apart. Nothing is changed when the request fails this way.
      schema: { type: string, examples: ['true'] }
    Destination:
      name: X-Qanapi-Destination
      in: header
      description: |
        Forward the processed payload to this absolute URL and relay the answer
        back, with its own status, body and headers. Must be `http` or `https`.
        Every request header travels except `x-qanapi-*`, `authorization` and
        the hop-by-hop set. Restricted by an allowlist where the installation
        sets one.
      schema: { type: string, format: uri, examples: ['https://payments.internal/charge'] }

  headers:
    ActionCount:
      description: |
        How many cryptographic operations the request performed. A zero in field
        mode means no named path matched anything.
      schema: { type: integer }
    ForwardedTo:
      description: |
        Present only when the response was relayed from a destination, naming
        it, so a caller can tell a proxied answer from one this service
        produced.
      schema: { type: string, format: uri }
    RateLimitLimit:
      description: Requests allowed per minute, per node.
      schema: { type: integer }
    RateLimitRemaining:
      description: Requests left in the current window.
      schema: { type: integer }

  responses:
    NoCredential:
      description: |
        No credential was presented. Send an API key in
        `X-Qanapi-Authorization`, or a bearer token in `Authorization`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadCredential:
      description: A credential was presented and did not verify.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: |
        Authenticated, but not permitted. Also returned for a revoked API key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such record.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFoundOrNotYours:
      description: |
        No such key, or it belongs to another user and the caller does not hold
        `apikey:manage`. The two are deliberately not distinguished.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ConfigurationNotFound:
      description: |
        No configuration has that proxy slug, or this credential may not reach
        it.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ProxyNotReachable:
      description: |
        Reported as a missing API key. The answer is deliberately the same
        whether no configuration has that slug or the presented key is not
        linked to the one that does, so an unrelated key cannot enumerate
        configurations.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: {
            "message": "API key not found",
            "error": "ApiKeyNotFoundException"
          }
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: |
        The request body or a parameter is invalid. `message` is always
        `Validation failed`; the specifics are in `errors`, keyed by field.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    PayloadTooLarge:
      description: |
        The body exceeded the installation's ceiling, 10 MB by default.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: The rate limit for this client address was exhausted.
      headers:
        X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    # ------------------------------------------------------------- errors

    Error:
      type: object
      required: [message, error]
      properties:
        message:
          type: string
          description: |
            Human readable. A server-side fault is described by its category and
            nothing more: operational detail stays in the service's own log.
          examples: ['Unauthorized.']
        error:
          type: string
          description: |
            A stable machine readable code. Branch on this rather than on
            `message`, which is shared between conditions that this code tells
            apart.
          examples: [InvalidApiKeyException]

    ValidationError:
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        required: [errors]
        properties:
          errors:
            type: object
            description: |
              Messages keyed by the field they concern. A failure with no single
              field to blame is filed under `request`.
            additionalProperties:
              type: array
              items: { type: string }
            examples:
            - {
                "type": ["The type field is required."],
                "configuration_ids": ["No configuration has the id `...`."]
              }

    # -------------------------------------------------------------- shared

    PrincipalType:
      type: string
      enum: [user, api_key, role]
      description: |
        The kinds of principal a policy statement or a clearance grant may name.
        An audit record may additionally carry `anonymous` or `system`.

    Page:
      type: object
      description: |
        The pagination envelope. `path` and every `*_page_url` are absolute, so
        a client can follow `next_page_url` directly.
      required: [current_page, data, last_page, path, per_page, total]
      properties:
        current_page: { type: integer }
        data: { type: array }
        first_page_url: { type: string, format: uri }
        from:
          type: [integer, 'null']
          description: 1-based index of the first row on this page; null when empty.
        last_page: { type: integer, description: At least 1, even for no results. }
        last_page_url: { type: string, format: uri }
        links:
          type: array
          description: Built for rendering a pager. Labels carry HTML entities.
          items:
            type: object
            properties:
              url: { type: [string, 'null'] }
              label: { type: string, examples: ['&laquo; Previous'] }
              page: { type: [integer, 'null'] }
              active: { type: boolean }
        next_page_url: { type: [string, 'null'], format: uri }
        path: { type: string, format: uri }
        per_page: { type: integer }
        prev_page_url: { type: [string, 'null'], format: uri }
        to:
          type: [integer, 'null']
          description: 1-based index of the last row on this page; null when empty.
        total:
          type: integer
          description: Every matching record, not the number on this page.

    # --------------------------------------------------------------- users

    User:
      type: object
      required: [id, email, name, role, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: [string, 'null'] }
        role:
          type: string
          enum: [admin, user]
          description: |
            `admin` is the only role that reaches user, policy and API key
            management without an explicit policy statement.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Trimmed and lowercased before it is looked up.
        password: { type: string, format: password }

    LoginResponse:
      type: object
      required: [token, token_type, expires_in, user]
      properties:
        token: { type: string, description: A signed JWT. }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: Seconds until expiry. }
        user: { $ref: '#/components/schemas/User' }

    CreateUserRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: |
            Trimmed and lowercased before it is stored, and unique across
            accounts.
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
        name: { type: string }
        role:
          type: string
          enum: [admin, user]
          default: user

    UpdateUserRequest:
      type: object
      description: |
        Every field is optional, and one that is absent is left alone rather
        than cleared.
      properties:
        email: { type: string, format: email }
        name: { type: string }
        password: { type: string, format: password, minLength: 12, maxLength: 1024 }
        role:
          type: string
          enum: [admin, user]
          description: |
            Requires `user:manage`, and may never be changed on your own
            account.
        current_password:
          type: string
          format: password
          description: |
            Required when changing the password or email address on your own
            account, and ignored when an administrator changes somebody else's.

    # ------------------------------------------------------------ api keys

    ApiKey:
      type: object
      required: [id, user_id, name, prefix, revoked_at, last_used_at, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id:
          type: string
          format: uuid
          description: |
            The owning user. Classification clearance for this key resolves
            through this user and their role.
        name: { type: string }
        prefix:
          type: string
          description: |
            The first twelve characters of the key, which is all that is stored
            in readable form. Useful for naming a key in a log without quoting
            the secret.
          examples: [qk_Q8oGyqBl3]
        revoked_at:
          type: [string, 'null']
          format: date-time
          description: Null while the key is usable. Revocation is permanent.
        last_used_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        configurations:
          type: array
          description: |
            The configurations this key may reach. An empty array means none:
            the grant is explicit, so a newly minted key cannot touch data until
            somebody says which data it is for.

            Absent, rather than empty, on the response to a rotation, which does
            not load them.
          items:
            type: object
            required: [id, name, proxy_slug]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              proxy_slug: { type: string }

    ApiKeyWithSecret:
      allOf:
      - $ref: '#/components/schemas/ApiKey'
      - type: object
        required: [key]
        properties:
          key:
            type: string
            description: |
              The plaintext, returned once and never recoverable afterwards.
              Only a hash of it is stored.
            examples: [qk_Q8oGyqBl3Icos_EYb8pitlJvMRHrsjUwUpfwoN7f9PKBINZ9-kBM]

    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Trimmed, and may not be empty once trimmed.
        user_id:
          type: string
          format: uuid
          description: |
            Defaults to the authenticated user. Minting a key for somebody else
            requires `apikey:manage`.
        configuration_ids:
          type: array
          description: |
            Requires `apikey:manage`. Omitted or empty mints a key that reaches
            nothing until it is linked.
          items: { type: string, format: uuid }

    SetApiKeyConfigurationsRequest:
      type: object
      required: [configuration_ids]
      properties:
        configuration_ids:
          type: array
          description: |
            The complete new set, not an addition to the existing one. An empty
            array detaches the key from everything.
          items: { type: string, format: uuid }

    # ------------------------------------------------------ configurations

    Configuration:
      type: object
      required: [id, name, proxy_slug, algorithm, mek_provider, mek_reference, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        proxy_slug:
          type: string
          description: |
            Appears in the URL of every encryption call, and is how policy
            statements name this configuration.
        algorithm:
          type: string
          const: aes-256-gcm
          description: Fixed at creation and not changeable.
        mek_provider:
          type: string
          description: |
            Where the master key lives. `local_aek` keeps it in the database
            sealed under the application key; other providers hand custody to an
            HSM or a cloud KMS.
          examples: [local_aek]
        mek_reference:
          type: [string, 'null']
          description: An HSM handle or key ARN, for providers that use one.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateConfigurationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Trimmed, and may not be empty once trimmed. Unique.
        proxy_slug:
          type: string
          description: |
            Optional, and unique. One is generated at random when omitted, which
            is the recommended case. A supplied value is lowercased, with
            anything other than a letter or digit becoming a hyphen.

    UpdateConfigurationRequest:
      type: object
      description: |
        Both fields are optional, and one that is absent is left alone. Neither
        may end up empty.
      properties:
        name: { type: string }
        proxy_slug: { type: string }

    # ----------------------------------------------------- classifications

    Classification:
      type: object
      required: [id, name, slug, description, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug:
          type: string
          description: |
            How policy statements and `X-Qanapi-Classification` name this label.
        description: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        users:
          type: array
          description: |
            Users holding this clearance directly. Present on the list and fetch
            responses; absent after a create or an update.
          items:
            type: object
            required: [id, email, name]
            properties:
              id: { type: string, format: uuid }
              email: { type: string, format: email }
              name: { type: string }
        roles:
          type: array
          description: |
            Roles whose members hold this clearance. Present on the list and
            fetch responses; absent after a create or an update.
          items:
            type: object
            required: [name]
            properties:
              name: { type: string, enum: [admin, user] }

    CreateClassificationRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        slug:
          type: string
          description: |
            Unique. Derived from the name when omitted, by lowercasing it and
            turning anything other than a letter or digit into a hyphen.
        description: { type: string }

    UpdateClassificationRequest:
      type: object
      description: |
        Every field is optional, and one that is absent is left alone.
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }

    Grant:
      type: object
      required: [principal_type, principal_id]
      properties:
        principal_type: { $ref: '#/components/schemas/PrincipalType' }
        principal_id:
          type: string
          description: |
            A user id, an API key id, or a role name, according to
            `principal_type`. Trimmed before it is matched.

    # ------------------------------------------------------------ policies

    Policy:
      type: object
      required: [id, name, description, effect, principal_type, principal_id, actions, resources, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        effect:
          type: string
          enum: [allow, deny]
          description: |
            Deny always wins, and the default with no statement at all is to
            refuse.
        principal_type: { $ref: '#/components/schemas/PrincipalType' }
        principal_id:
          type: string
          description: |
            A user id, an API key id, or a role name, according to
            `principal_type`.
        actions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PolicyAction' }
        resources:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PolicyResource' }
        created_at: { type: string, format: date-time }

    PolicyAction:
      type: string
      description: |
        An exact action, a namespace wildcard such as `kms:*`, or `*` for
        everything. A namespace wildcard must name a namespace that exists, and
        only an administrator may write `*`.
      examples: [encrypt, 'kms:*', 'audit:read']
      enum:
      - encrypt
      - decrypt
      - 'kms:read'
      - 'kms:create'
      - 'kms:update'
      - 'kms:import'
      - 'kms:export'
      - 'kms:rotate'
      - 'kms:revoke'
      - 'kms:restore'
      - 'classification:read'
      - 'classification:manage'
      - 'configuration:read'
      - 'configuration:manage'
      - 'apikey:manage'
      - 'user:manage'
      - 'policy:manage'
      - 'audit:read'
      - 'audit:export'
      - 'audit:purge'
      - 'kms:*'
      - 'classification:*'
      - 'configuration:*'
      - 'apikey:*'
      - 'user:*'
      - 'policy:*'
      - 'audit:*'
      - '*'

    PolicyResource:
      type: string
      description: |
        What the statement applies to. Either `*`, the bare words `audit` or
        `system`, or one of the prefixed forms: `configuration:<slug>`,
        `key:<uuid>`, `classification:<slug>`, `audit:<name>` or
        `system:<name>`. Each prefix also takes `*` in place of the name, so
        `configuration:*` covers every configuration.
      examples: ['configuration:952zpx6vyig3sdyp', 'key:*', 'audit', '*']

    CreatePolicyRequest:
      type: object
      required: [name, effect, principal_type, principal_id, actions, resources]
      properties:
        name:
          type: string
          minLength: 1
          description: Trimmed, and may not be empty once trimmed.
        description: { type: string }
        effect: { type: string, enum: [allow, deny] }
        principal_type: { $ref: '#/components/schemas/PrincipalType' }
        principal_id: { type: string }
        actions:
          type: array
          minItems: 1
          description: Duplicates are collapsed.
          items: { $ref: '#/components/schemas/PolicyAction' }
        resources:
          type: array
          minItems: 1
          description: Duplicates are collapsed.
          items: { $ref: '#/components/schemas/PolicyResource' }

    # ----------------------------------------------------------------- kms

    KeyState:
      type: string
      enum: [active, revoked]

    KmsKeyBrief:
      type: object
      description: The compact form returned by the list endpoint.
      required: [key_id, name, external_id, type, algorithm, state, created_at]
      properties:
        key_id:
          type: string
          format: uuid
          description: How every other KMS endpoint names this key.
        name: { type: [string, 'null'] }
        external_id:
          type: [string, 'null']
          description: |
            A caller's own identifier, for reconciling against another system.
        type: { type: string, enum: [AES, RSA] }
        algorithm:
          type: string
          description: The key length, without the cipher mode.
          examples: [AES-256, RSA-2048]
        cipher_mode:
          type: string
          enum: [gcm, cbc]
          description: |
            The AES mode. Absent for an RSA key, which has none.
        state: { $ref: '#/components/schemas/KeyState' }
        created_at: { type: string, format: date-time }

    KmsKey:
      allOf:
      - $ref: '#/components/schemas/KmsKeyBrief'
      - type: object
        required: [private_material_retrievable, usage_mask, updated_at]
        properties:
          private_material_retrievable:
            type: boolean
            description: |
              Whether the private half may ever leave this service. Fixed at
              creation: it can be withdrawn later but never granted, because the
              guarantee made when the key was generated has to keep holding.
          usage_mask:
            type: array
            description: |
              What the key may be used for. Defaults to `["encrypt",
              "decrypt"]` when a key is created without one.
            items: { type: string, enum: [encrypt, decrypt, sign, verify] }
          classification_id:
            type: string
            format: uuid
            description: |
              Present when the key carries a classification. Decrypting through
              it then requires the matching clearance.
          revoke_reason:
            type: string
            description: Present only on a revoked key, and only when one was given.
          rotated_from:
            type: string
            format: uuid
            description: The key this one replaced, when it came from a rotation.
          export_window_expires_at:
            type: [string, 'null']
            format: date-time
            description: |
              After this, export is refused even for an exportable key. Present
              only on exportable keys.
          export_count:
            type: integer
            description: |
              How many times the private half has been exported. Present only on
              exportable keys.
          public_key_pem:
            type: string
            description: RSA keys only, and always safe to hand out.
          private_key_material:
            type: object
            description: |
              Present only in the response to an export, or to a create with
              `export_on_create`. Never returned by a plain fetch.
            required: [jwe]
            properties:
              jwe:
                type: string
                description: |
                  RFC 7516 compact serialisation, `RSA-OAEP-256` with `A256GCM`,
                  wrapped to the named wrap key.
          updated_at: { type: string, format: date-time }

    CreateKmsKeyRequest:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [AES, RSA] }
        algorithm:
          type: string
          description: |
            An exact choice, and the only way to ask for CBC. Derived from
            `type` with `key_length` or `rsa_modulus` when omitted.
          enum: [aes-128-gcm, aes-192-gcm, aes-256-gcm, aes-128-cbc, aes-192-cbc, aes-256-cbc, rsa-2048, rsa-4096]
        key_length:
          type: integer
          enum: [128, 192, 256]
          default: 256
          description: AES only, and ignored when `algorithm` is given.
        rsa_modulus:
          type: integer
          enum: [2048, 4096]
          default: 2048
          description: RSA only, and ignored when `algorithm` is given.
        usage_mask:
          type: array
          description: Defaults to `["encrypt", "decrypt"]`. Duplicates are collapsed.
          items: { type: string, enum: [encrypt, decrypt, sign, verify] }
        name: { type: string }
        external_id: { type: string }
        classification_id: { type: string, format: uuid }
        classification:
          type: string
          description: A classification slug, as an alternative to the id.
        private_material_retrievable:
          type: boolean
          default: false
          description: |
            Decide this now. A key generated without it can never be exported,
            and the setting cannot be granted afterwards.
        export_window_expires_at:
          type: string
          format: date-time
          description: |
            After this instant, export is refused even for an exportable key.
        export_on_create:
          type: boolean
          default: false
          description: |
            Return the private half in this response, wrapped to
            `wrap_with_key_id`. Requires `private_material_retrievable`.
        wrap_with_key_id:
          type: string
          format: uuid
          description: |
            An existing RSA key to wrap the export to. Required when
            `export_on_create` is true.

    ImportKmsKeyRequest:
      type: object
      description: Supply exactly one of `jwe` or `public_key_pem`.
      properties:
        type:
          type: string
          enum: [AES, RSA]
          description: Required alongside `jwe`; inferred for a bare public key.
        algorithm:
          type: string
          description: |
            The material is checked against this where it can be. Inferred from
            the material when omitted.
          enum: [aes-128-gcm, aes-192-gcm, aes-256-gcm, aes-128-cbc, aes-192-cbc, aes-256-cbc, rsa-2048, rsa-4096]
        jwe:
          type: string
          description: |
            The private key wrapped to this service's transport public key, from
            `GET /api/v3/qanapi-public-key`.
        public_key_pem:
          type: string
          description: |
            A bare public half. Importing only this keeps the unwrapping key off
            this server entirely.
        usage_mask:
          type: array
          items: { type: string, enum: [encrypt, decrypt, sign, verify] }
        name: { type: string }
        external_id: { type: string }
        classification_id: { type: string, format: uuid }
        private_material_retrievable: { type: boolean, default: false }
        export_window_expires_at: { type: string, format: date-time }

    UpdateKmsKeyRequest:
      type: object
      description: |
        Every field is optional, and one that is absent is left alone.
      properties:
        name: { type: string }
        external_id: { type: string }
        usage_mask:
          type: array
          items: { type: string, enum: [encrypt, decrypt, sign, verify] }
        private_material_retrievable:
          type: boolean
          description: May be set to false, never to true.
        export_window_expires_at: { type: string, format: date-time }

    ExportKmsKeyRequest:
      type: object
      required: [wrap_with_key_id]
      properties:
        wrap_with_key_id:
          type: string
          format: uuid
          description: |
            An RSA key whose public half wraps the export. Whoever holds its
            private half is the only party that can read the result.

    RotateKmsKeyRequest:
      type: object
      description: Optional; omit the body entirely to rotate without exporting.
      properties:
        export_on_create:
          type: boolean
          default: false
          description: |
            Return the replacement's private half in this response. Requires the
            key to be exportable.
        wrap_with_key_id:
          type: string
          format: uuid
          description: Required when `export_on_create` is true.

    RevokeKmsKeyRequest:
      type: object
      description: Optional; omit the body entirely to revoke without a reason.
      properties:
        reason:
          type: string
          description: Recorded on the key and on the audit trail.
          examples: ['Key compromise']

    # --------------------------------------------------------------- audit

    AuditRecord:
      type: object
      description: |
        Append-only and hash chained. `record_hash` is an HMAC over the whole
        record and its predecessor's hash, so editing any field of any record
        breaks every link after it.
      required: [id, timestamp, request_id, instance_id, principal_type, action, status, status_code, latency_ms, record_hash, chain_version, created_at]
      properties:
        id: { type: string, format: uuid }
        timestamp: { type: string, format: date-time }
        request_id:
          type: string
          description: |
            Correlates with the `X-Request-Id` of the request. A client-supplied
            value is preserved rather than overwritten, so a caller can tie a
            support request to its own trace.
        instance_id:
          type: string
          description: |
            The node that wrote the record. Chains are maintained per node, so
            this is the unit of verification.
        principal_type:
          type: string
          enum: [user, api_key, anonymous, system]
        principal_id: { type: [string, 'null'] }
        client_ip:
          type: [string, 'null']
          description: |
            Honoured from a forwarding header only when the immediate peer is on
            the installation's list of permitted proxies; otherwise the peer
            address itself.
        user_agent: { type: [string, 'null'] }
        action: { type: string, examples: ['encryption.encrypt'] }
        resource_type: { type: [string, 'null'] }
        resource_id: { type: [string, 'null'] }
        configuration_id: { type: [string, 'null'], format: uuid }
        status:
          type: string
          enum: [success, denied, error]
          description: |
            `denied` is an authorisation decision and `error` is a fault. They
            are distinguished because a wall of denials is a different
            operational signal from a wall of faults.
        status_code: { type: integer }
        error_message: { type: [string, 'null'] }
        latency_ms: { type: integer }
        metadata:
          type: [object, 'null']
          description: |
            Action-specific detail: the fields touched, the mode, the byte
            count, a forwarding destination and what it answered.
        record_hash: { type: string }
        previous_record_hash: { type: [string, 'null'] }
        chain_version:
          type: integer
          description: |
            Which chain construction produced this record. Existing records keep
            verifying under the construction that wrote them.
        created_at: { type: string, format: date-time }

    ExportRequest:
      type: object
      description: |
        Accepts every filter the query endpoint accepts, plus the three fields
        at the end. `page` and `per_page` are accepted and ignored: an export
        covers the whole matching range up to its ceiling.
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        action:
          type: string
          description: An exact action, or a `kms.*` style prefix.
        configuration_id: { type: string, format: uuid }
        principal_id: { type: string }
        principal_type: { type: string, enum: [user, api_key, anonymous, system] }
        status: { type: string, enum: [success, denied, error] }
        request_id: { type: string }
        instance_id: { type: string }
        format:
          type: string
          enum: [jsonl, csv]
          default: jsonl
          description: |
            `jsonl` streams one JSON record per line; `csv` flattens them into a
            header row and one row per record.
        gzip:
          type: boolean
          default: false
          description: |
            Compress the stream. Signalled by `Content-Encoding`, not by a
            different content type.
        purge:
          type: boolean
          default: false
          description: |
            Delete the exported records in the same transaction that read them,
            so nothing is purged that was not successfully exported. Requires
            `audit:purge`, and is itself recorded with the window it covered.

    ChainVerification:
      type: object
      required: [verified, records, broken_links, gaps, explained_by_purge, gaps_expected]
      properties:
        verified:
          type: boolean
          description: |
            False when any link is broken, or when a gap is not accounted for by
            a recorded purge and the filters do not explain it.
        records: { type: integer, description: Records examined. }
        broken_links:
          type: array
          description: |
            The finding that matters: the id of each record whose hash does not
            follow from its predecessor, which means it was edited after it was
            written.
          items: { type: string, format: uuid }
        gaps:
          type: array
          description: |
            The id of each record whose predecessor is missing. Expected
            whenever the query is filtered, and expected after an authorised
            purge, so this is reported separately from a broken link rather than
            raised as tampering.
          items: { type: string, format: uuid }
        explained_by_purge:
          type: array
          description: |
            The subset of `gaps` that a recorded purge accounts for. Those
            records live on in the export that the purge produced.
          items: { type: string, format: uuid }
        gaps_expected:
          type: boolean
          description: |
            Whether the filters themselves narrow the range, in which case gaps
            carry no information.

    # ----------------------------------------------------------- transport

    QanapiKey:
      type: object
      required: [key_id, algorithm, public_key_material, rotates_after, expires_at, created_at]
      properties:
        key_id:
          type: string
          description: Names this pair, and travels in the JWE header.
          examples: [QANAPI-PUB-1DAF66C2]
        algorithm: { type: string, examples: [RSA-2048] }
        public_key_material: { type: string, description: PEM. }
        rotates_after:
          type: string
          format: date-time
          description: |
            When the service begins advertising a successor. Re-read this
            endpoint after it.
        expires_at:
          type: string
          format: date-time
          description: |
            After this, a payload wrapped to this pair is no longer accepted.
        created_at: { type: string, format: date-time }

    # -------------------------------------------------------------- health

    Readiness:
      type: object
      description: |
        Only `status` is present unless the installation exposes the detailed
        body.
      required: [status]
      properties:
        status: { type: string, enum: [ready, unavailable] }
        instance_id: { type: string }
        database: { type: boolean }
        fips:
          type: object
          properties:
            build:
              type: boolean
              description: Whether the binary was compiled with the validated module.
            active:
              type: boolean
              description: Whether that module is in FIPS mode at runtime.
        audit:
          type: object
          properties:
            queue_depth: { type: integer }
            metrics:
              type: object
              properties:
                enqueued: { type: integer }
                written: { type: integer }
                spilled:
                  type: integer
                  description: |
                    Records written to the disk write-ahead log under
                    backpressure.
                replayed: { type: integer }
                dropped: { type: integer }
                rejected: { type: integer }
        crypto:
          type: object
          properties:
            heavy_permits_available:
              type: integer
              description: |
                Free slots in the concurrency budget for expensive operations
                such as password hashing and RSA.
        license:
          type: object
          description: The license in force on this node.
          required: [status, source, expiring_soon]
          properties:
            status:
              type: string
              enum: [active, expired, not_yet_valid, invalid, missing]
              description: |
                Anything other than `active` refuses new encryption while
                continuing to serve decryption.
            source: { type: string, description: Where the license was read from. }
            licensee: { type: string }
            license_id: { type: string }
            issued_at: { type: string, format: date-time }
            expires_at: { type: string, format: date-time }
            features: { type: array, items: { type: string } }
            notes: { type: string, description: The issuer's free text, such as a contract reference. }
            key_fingerprint:
              type: string
              description: |
                Identifies the verification key, so one issuer key can be told
                from its successor without printing either.
            problem: { type: string, description: Why nothing is in force, when nothing is. }
            expiring_soon: { type: boolean }
        revocation_epoch:
          type: integer
          description: |
            Incremented by every security-sensitive mutation. Each node polls it
            and treats cached decisions stamped with an older value as a miss,
            which is what makes a revocation take effect cluster-wide at once.
